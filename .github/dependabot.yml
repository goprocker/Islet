# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must be the same version, or CodeQL fails
      codeql:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/launch-film"
    schedule:
      interval: "weekly"
    groups:
      # the @remotion packages share one lockfile; one PR keeps them from conflicting
      remotion:
        patterns: ["remotion", "@remotion/*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 (native compiler) yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
