# Builds the Windows installer from a version tag, signs it through the
# SignPath Foundation when its secrets are set, and publishes the GitHub
# release: the installer people download (Islet-Setup), and for auto-update a copy
# named Islet-Update with its .blockmap and latest.yml, so updates aren't counted as downloads.
#
# Release: bump package.json, commit, then `git tag vX.Y.Z && git push --tags`.
#
# SignPath setup (after approval): add repo secret SIGNPATH_API_TOKEN and repo
# variable SIGNPATH_ORGANIZATION_ID. Until then releases go out unsigned; once the
# token is set, a release fails if signing fails or the publisher is not SignPath Foundation.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
        shell: bash # expands test/*.test.js itself; PowerShell passed the pattern through and v2.3.2 failed

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Find installer
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # a tag pushed without bumping package.json would republish the old version under the new tag
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} but package.json says ${{ steps.ver.outputs.version }}"; exit 1
          fi

      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/Islet-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Islet
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Signing changes the file, so the blockmap and latest.yml hashes must be redone.
      - name: Replace installer with signed copy
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: |
          exe="Islet-Setup-${{ steps.ver.outputs.version }}.exe"
          cp "signed/$exe" "dist/$exe"
          node build/rehash.js "dist/$exe"

      - name: Verify expected Windows publisher
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $exe = "dist/Islet-Setup-${{ steps.ver.outputs.version }}.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status), not Valid" }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=SignPath Foundation(,|$)') {
            throw "Unexpected publisher: $($signature.SignerCertificate.Subject)"
          }

      # auto-update downloads Islet-Update-X.exe (same bytes), so only real downloads count
      - name: Separate the auto-update copy
        shell: bash
        run: node build/update-asset.js dist "${{ steps.ver.outputs.version }}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          exe="dist/Islet-Setup-$v.exe"
          upd="dist/Islet-Update-$v.exe"
          gh release create "v$v" "$exe" "$exe.blockmap" "$upd" "$upd.blockmap" dist/latest.yml \
            --title "Islet $v" --generate-notes
