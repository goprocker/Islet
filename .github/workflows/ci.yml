name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Packaging check
        run: node scripts/check-build-files.js
      - name: Website download version
        run: node scripts/site-version.js
      - name: Tests
        run: npm test
