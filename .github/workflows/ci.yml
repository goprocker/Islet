name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Electron (syntax, packaging checks, tests)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        shell: bash
        run: |
          git ls-files -z -- src renderer settings hooks build scripts | while IFS= read -r -d '' file; do
            if [[ "$file" == *.js ]]; then node --check "$file" || exit 1; fi
          done
      - name: Packaging check
        run: node scripts/check-build-files.js
      - name: Website download version
        run: node scripts/site-version.js
      - name: Tests
        run: npm test
        shell: bash

  installer:
    name: Windows installer build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build without publishing
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/Islet-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  landing:
    name: Landing site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check download versions
        run: node ../scripts/site-version.js
      - name: Run the production Netlify build
        run: |
          python3 - <<'PY'
          import subprocess, tomllib
          with open('netlify.toml', 'rb') as f:
              command = tomllib.load(f)['build']['command']
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', command], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-site
          path: landing/public
          if-no-files-found: error
          retention-days: 7

  film:
    name: Launch film (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: launch-film
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launch-film/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
