name: Feature request
description: Suggest an idea for Islet
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or the moment this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Islet to do?
      description: How it should look and behave in the notch, if you have an idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you handle it today
      description: Other apps or workarounds, if any.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
