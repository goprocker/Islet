name: Bug report
description: Something in Islet doesn't work as it should
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't use this form: use the [private report](https://github.com/goprocker/Islet/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. It's fine to say you're not sure, and to say which parts you haven't tested.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it happens only sometimes or you can't reproduce it, write what you remember and say that it's intermittent.
      placeholder: |
        1. Open Islet
        2. Play a song in Spotify
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Islet version
      description: Shown in Settings, or in the installer file name.
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver`, and copy the version and build.
      placeholder: "Windows 11 23H2, build 22631"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Music / media player
        - Claude Code or Codex
        - Notifications
        - Battery / power
        - Volume or brightness HUD
        - Timer / Pomodoro
        - Clipboard, notes or shelf
        - Calendar / weather
        - Settings / tray
        - Installer / startup
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer from the website or releases
        - Ran from source (npm start)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here. Remove personal data, such as calendar links or tokens.
