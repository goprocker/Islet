<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Islet</title>
<link rel="stylesheet" href="notch.css">
</head>
<body>
<div class="notch" id="notch" tabindex="0" role="button" aria-expanded="false" aria-label="Now playing. Hover to expand">
  <div class="pill">
    <img class="art" alt="">
    <span class="priv" id="pillPriv"></span>
    <svg class="moon" id="pillMoon" viewBox="0 0 24 24" aria-label="Do Not Disturb on" hidden><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <span class="chip" id="pillChip"></span>
    <i class="dot" aria-hidden="true"></i>
    <canvas id="mini" width="40" height="14"></canvas>
    <span class="batt" id="pillBatt" hidden></span>
  </div>

  <div class="toastv" role="status" aria-live="polite">
    <span class="badge" id="tBadge"></span>
    <div class="tmeta">
      <small id="tApp"></small>
      <b id="tTitle"></b>
      <span id="tBody"></span>
    </div>
  </div>

  <div class="full">
    <div class="claude" aria-live="polite">
      <div class="who">
        <i class="dot" aria-hidden="true"></i>
        <button class="project" id="cProject" title="Open project folder">Claude</button>
        <div class="sessions" id="cSessions"></div>
        <small id="cAgo"></small>
      </div>
      <em id="cStatus"></em>
      <ol id="cActions"><li>No activity yet</li></ol>
      <div class="perm" id="perm" hidden>
        <p><b id="permTool"></b> <span id="permDetail"></span></p>
        <div class="permBtns">
          <button id="permDeny" class="deny">Deny</button>
          <button id="permAllow" class="allow">Allow</button>
        </div>
      </div>
    </div>
    <div class="music" id="music" title="Scroll to change Spotify volume">
      <section class="panel" id="clipPanel" hidden aria-label="Clipboard history">
        <header><b>Clipboard</b><button class="link" id="clipClear">Clear</button></header>
        <ol id="clipList"></ol>
        <p class="empty" id="clipEmpty">Copy some text and it shows up here. Click an item to copy it again.</p>
      </section>
      <section class="panel" id="shelfPanel" hidden aria-label="File shelf">
        <header><b>Shelf</b><button class="link" id="shelfAddBtn">Add files</button></header>
        <ul id="shelfList"></ul>
        <p class="empty" id="shelfEmpty">Drop files here to hold them, then drag them out anywhere.</p>
      </section>
      <div class="albumv" id="albumv" hidden>
        <img class="art bg" alt="">
        <img class="art big" alt="">
        <div class="ainfo"><b id="aTitle"></b><span id="aArtist"></span><em id="aLyric"></em></div>
      </div>
      <div class="row">
        <img class="art" id="artBtn" alt="Album art. Click to enlarge" title="Click to enlarge">
        <div class="meta">
          <div class="title" id="title">Nothing playing</div>
          <div class="from"><img id="spIcon" class="appicon" alt="Spotify"><span class="artist" id="artist">Play music in Spotify or a browser to see it here</span></div>
        </div>
        <button id="like" class="like" aria-label="Save to Liked Songs" hidden><svg viewBox="0 0 24 24"><path d="M12 20.5 4.3 13a4.9 4.9 0 0 1 6.9-7l.8.8.8-.8a4.9 4.9 0 0 1 6.9 7z"/></svg></button>
        <canvas id="wave" width="44" height="18"></canvas>
      </div>
      <div class="bar"><span id="pos">0:00</span><div class="seek" id="seekArea" title="Click to jump"><div class="track"><i id="prog"></i></div></div><span id="dur">0:00</span></div>
      <div class="upnext" id="upnext"></div>
      <div class="ctl">
        <span class="left"></span>
        <div class="buttons">
          <button id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button id="play" class="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
          <button id="next" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        </div>
        <span class="side" id="side"></span>
      </div>
    </div>
    <section class="stat" aria-label="Time and battery">
      <time id="clock"></time>
      <small id="date"></small>
      <span class="batt" id="batt" hidden></span>
      <small id="power"></small>
      <span class="priv" id="priv"></span>
    </section>
    <nav class="tools" aria-label="Islet tools">
      <button id="dndBtn" aria-pressed="false" title="Do Not Disturb: pause notification pop-ups"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button id="clipBtn" aria-pressed="false" title="Clipboard history"><svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1zm1 2v1h4V4zM6 6v14h12V6h-2v1H8V6zm2 4h8v2H8zm0 4h6v2H8z"/></svg></button>
      <button id="shelfBtn" aria-pressed="false" title="File shelf"><svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2 0v14h14V7h-8.8l-2-2z"/></svg></button>
    </nav>
  </div>
</div>
<script src="notch.js"></script>
</body>
</html>
